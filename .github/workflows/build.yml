name: Build and check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Check configuration, profiles, and native build
        run: ./scripts/check.sh
      - name: Cross-compile Intel app
        run: ARCH=x86_64 BUILD_DIR="$RUNNER_TEMP/intel" ./scripts/build.sh
